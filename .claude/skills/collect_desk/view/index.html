<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수집</title>
<style>
:root{--bg:#fff;--bg2:#f7f7f8;--line:#e4e4e7;--line2:#d4d4d8;--tx:#1f1f23;--tx2:#5f5f68;--tx3:#9a9aa3;--accent:#6d4fe0;--warn:#b98000;--err:#d9304a;--ok:#16a34a;--font:system-ui,"Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e1e;--bg2:#262626;--line:#363636;--line2:#454545;--tx:#dcddde;--tx2:#a3a3a8;--tx3:#6f6f75;--accent:#9c86f5;--warn:#e0ac2a;--err:#ef5d73;--ok:#3fb26b}}
:root{--bg3:color-mix(in srgb,var(--tx) 8%,var(--bg));--ac2:color-mix(in srgb,var(--accent) 14%,var(--bg));--warn2:color-mix(in srgb,var(--warn) 16%,var(--bg));--err2:color-mix(in srgb,var(--err) 14%,var(--bg))}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sw{width:28px;height:16px;border-radius:9px;background:var(--line2);border:0;position:relative;flex:none;padding:0;display:inline-block}
.sw i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff}
.sw.on{background:var(--accent)}.sw.on i{left:14px}
.sw{cursor:pointer}.sw[disabled]{opacity:.35;cursor:not-allowed}
.chip button{border:0;background:none;cursor:pointer;color:var(--tx3);padding:0 0 0 3px;display:none;line-height:1}
.chip:hover button{display:inline}
.chips input{border:0;border-bottom:1px solid var(--line2);background:none;outline:0;width:64px;font:inherit;font-size:12px;color:inherit;padding:1px 2px}
.purpose{border:0;border-bottom:1px solid transparent;background:none;outline:0;width:100%;font:inherit;color:inherit;padding:1px 0}
.purpose:hover,.purpose:focus{border-bottom-color:var(--line2)}
select{border:1px solid var(--line2);border-radius:5px;background:var(--bg);color:inherit;font:inherit;font-size:12px;padding:1px 4px}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.pill button{border:0;background:none;padding:1px 8px;cursor:pointer}
.pill button:hover{background:var(--bg3)}
.pill b{padding:0 8px;font-weight:500;font-size:12px}
.pill button.on{background:var(--ac2);font-weight:600;cursor:default}
.chips.dim .chip{opacity:.5}
/* 안 3 가(11-12 사용자) — 글 대신 그림 · 마우스를 올리면 낱말 이름(창 안 iframe 이라 옵시디언 풍선이 없어 직접 그림) */
.tt{position:relative}
.tt:hover::after{content:attr(aria-label);position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);background:var(--tx);color:var(--bg);font-size:11px;font-weight:400;padding:2px 6px;border-radius:4px;white-space:nowrap;z-index:9;pointer-events:none}
.rec{display:inline-flex;gap:4px;align-items:center;border:1px dashed var(--accent);color:var(--accent);background:none;border-radius:5px;padding:0 6px;line-height:20px;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.rec:hover{background:var(--ac2)}
.pill.ico button{padding:2px 7px;display:inline-flex;color:var(--tx2)}.pill.ico button.on{color:var(--accent)}
.bars{display:inline-flex;align-items:flex-end;gap:1px;height:20px;padding:0 2px;border-bottom:1px solid var(--line2)}
.bars i{width:3px;background:var(--tx3);border-radius:1px 1px 0 0;min-height:1px;opacity:.7}
.hov{visibility:hidden}.line:hover .hov,.hov:focus{visibility:visible}
.meta{display:flex;gap:14px;margin-top:4px;color:var(--tx3);font-size:11.5px;font-variant-numeric:tabular-nums}
.meta span{display:inline-flex;gap:4px;align-items:center}.meta svg{width:12px;height:12px}
.mk{color:var(--accent);display:inline-flex}.mk svg{width:12px;height:12px}
.pop{position:absolute;top:34px;right:8px;width:260px;z-index:5;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:12px 14px;box-shadow:0 6px 18px rgba(0,0,0,.12);display:grid;grid-template-columns:18px 1fr auto;gap:10px 8px;align-items:center}
.pop svg{color:var(--tx2)}.b-l,.tp{position:relative}
.pop{grid-template-columns:18px 1fr auto auto!important}
.hint{position:static;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line2);color:var(--tx3);font-size:10px;line-height:1;cursor:help;outline:0}
.hint:hover,.hint:focus{color:var(--accent);border-color:var(--accent)}
.hint .tip{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:12;background:var(--bg);color:var(--tx);border:1px solid var(--line2);border-radius:7px;padding:9px 11px;box-shadow:0 6px 18px rgba(0,0,0,.14);font-size:12px;line-height:1.5;cursor:default;white-space:normal;text-align:left}
.hint:hover .tip,.hint:focus .tip{display:block}
.hint .tip b{display:block;font-weight:600;margin-bottom:3px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:9}
.dlg>div{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:16px 18px;max-width:340px}
.dlg p{margin:0 0 14px}
.dlg .row{display:flex;justify-content:flex-end;gap:6px}
.rj{width:340px}.rj .q{margin:0 0 3px}
.rj .t{margin:0 0 12px;font-size:11.5px;color:var(--tx3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wd{border:1px solid var(--line2);background:none;border-radius:4px;padding:0 7px;font-size:12px;line-height:20px;cursor:pointer}
.wd:hover{background:var(--bg3)}.wd.on{background:var(--err2);border-color:transparent;color:var(--err);text-decoration:line-through;text-decoration-thickness:1.5px}
.rj .memo{display:block;width:100%;margin:12px 0 16px;border:0;border-bottom:1px solid var(--line2);background:none;outline:0;font:inherit;color:inherit;padding:2px 0}
.rj .memo:focus{border-bottom-color:var(--accent)}
.btn{border:1px solid var(--line2);background:var(--bg);border-radius:5px;padding:3px 9px;cursor:pointer;font-size:12px}
.btn.warn{background:var(--warn2);border-color:transparent;color:var(--warn);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}.dot.off{background:var(--line2)}
.sm{font-size:11.5px;color:var(--tx3)}
.flair{font-size:11.5px;color:var(--tx3);white-space:nowrap}
.flair.warn{color:var(--warn);font-weight:600}.flair.err{color:var(--err);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{display:inline-flex;align-items:center;background:var(--bg3);border-radius:4px;padding:1px 7px;font-size:12px;line-height:20px}
.chip.lock{background:none;border:1px dashed var(--line2);color:var(--tx3);font-family:Consolas,monospace;font-size:11px}
.ed{display:grid;grid-template-columns:62px minmax(0,1fr);gap:9px 12px;align-items:center}
.ed>label{color:var(--tx2);font-size:12px;align-self:start;padding-top:1px}
.line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pair{display:flex;gap:6px;align-items:center}
.ev{display:grid;grid-template-columns:78px minmax(0,1fr);gap:3px 8px;font-size:12px}
.ev span:nth-child(odd){color:var(--tx3);font-variant-numeric:tabular-nums}
.ev .bad{color:var(--err)}.ev .me{color:var(--accent)}
.crow{display:flex;gap:8px;align-items:center;min-height:25px;padding:1px 4px;border-radius:4px}
.crow:hover{background:var(--bg2)}
.crow .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow.off .n{color:var(--tx3)}
.b{display:grid;grid-template-columns:minmax(190px,270px) minmax(0,1fr);min-height:100vh}
.b-l{border-right:1px solid var(--line);padding:10px 8px;background:var(--bg2)}
.b-top{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:0 6px}
.b-top .sm:not(:first-child){margin-left:10px}
.grp-h{display:flex;gap:6px;align-items:center;color:var(--tx2);font-size:12px;padding:10px 6px 4px;font-weight:600}
.grp-b{margin-left:12px;border-left:1px solid var(--line2);padding-left:6px}
.lr{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:5px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.lr:hover{background:var(--bg3)}.lr.sel{background:var(--ac2)}
.lr .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr.off .n{color:var(--tx3)}
.b-r{padding:18px 26px;min-width:0}
.b-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.b-h h2{margin:0;font-size:19px;font-weight:650}
.stats{display:flex;margin:16px 0 18px;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.stats button,.stats div{flex:1;min-width:0;border:0;background:none;border-right:1px solid var(--line);padding:9px 12px;text-align:left}
.stats button{cursor:pointer}
.stats>:last-child{border-right:0}
.stats button:hover{background:var(--bg2)}.stats .sel{background:var(--ac2)!important}
.stats b{display:block;font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--tx2);white-space:nowrap}
.stats .warn b{color:var(--warn)}
.b-g{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px}
.sec{font-size:12px;font-weight:600;color:var(--tx2);margin:0 0 8px}
.it{display:flex;gap:8px;align-items:center;min-height:27px;padding:1px 5px;border-radius:4px;border:0;background:none;width:100%;text-align:left}
.it.go{cursor:pointer}.it.go:hover{background:var(--bg2)}
.it .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .y{color:var(--tx3);font-size:11.5px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:2px}
.prob{display:flex;gap:8px;background:var(--err2);border-radius:5px;padding:5px 9px;margin-top:12px;font-size:12px}
.none{padding:40px;text-align:center;color:var(--tx3)}
.it .act{display:none;padding:0 7px;line-height:19px;flex:none}
.it:hover .act,.it:focus-within .act{display:inline-block}
.ib{border:0;background:none;padding:3px;border-radius:5px;cursor:pointer;display:inline-flex;color:var(--tx2)}
.ib:hover{background:var(--bg3)}
.btn.err{background:var(--err2);border-color:transparent;color:var(--err);font-weight:600}
.prob{align-items:center}.prob .s{flex:1;min-width:0}
.lr.add{color:var(--tx2);position:sticky;bottom:0;margin-top:10px;background:var(--bg2);box-shadow:0 -8px 8px -6px var(--bg2)}
.lr.add:hover{background:var(--bg3)}
@media (max-width:760px){.b{grid-template-columns:minmax(0,1fr);min-height:0}.b-l{border-right:0;border-bottom:1px solid var(--line)}.b-r{padding:14px}.b-g{grid-template-columns:minmax(0,1fr)}.stats{flex-wrap:wrap}.stats button,.stats div{flex:1 1 30%}}
/* 위쪽 꼴(11-06 사용자 1안) — 왼쪽 곁창이 옆에 열렸거나(brain-base env) 좁은 폭이면 출처 나무 대신 묶음 줄 + 칩. 바탕 = 본문 색(곁창 바탕과 갈림) */
.tp{position:relative;border-bottom:1px solid var(--line);padding:10px 200px 10px 16px;background:var(--bg)}
.tp .b-top{position:absolute;top:9px;right:14px;padding:0}
/* 모아보기 바로가기(11-12 사용자 안 2) — 고른 출처 머리 줄 «그림 + 이름» · 누르면 그 .moa 를 옆 칸에 */
.moc{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;padding:1px 8px;background:none;cursor:pointer;font-size:12px;color:var(--tx2)}
.moc:hover{border-color:var(--accent);color:var(--accent)}
.tp-r{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:start;padding:2px 0}
.tp-g{display:flex;gap:6px;align-items:center;color:var(--tx2);font-size:12px;font-weight:600;padding-top:5px}
.tp-c{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ch{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:5px;border:1px solid var(--line);background:none;cursor:pointer;max-width:250px}
.ch:hover{background:var(--bg3)}.ch.sel{background:var(--ac2);border-color:transparent}
.ch .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch.off .n{color:var(--tx3)}
.ch.add{border-style:dashed;color:var(--tx2)}
@media (max-width:760px){.tp{padding:10px 12px}.tp .b-top{position:static;justify-content:flex-end;margin-bottom:6px}}

/* 일어난 일 상세(11-12 · 사용자 B 기록 칸) */
.hs{display:flex;flex-direction:column;gap:1px}
.hr{display:grid;grid-template-columns:74px 18px minmax(0,1fr);gap:2px 8px;align-items:center;padding:3px 4px;border-radius:4px;cursor:pointer;font-size:12px}
.hr:hover{background:var(--bg2)}.hr.open{background:var(--ac2)}
.hr .tm{color:var(--tx3);font-variant-numeric:tabular-nums}
.hr .wh{display:inline-flex;color:var(--tx2)}.hr .wh svg{width:13px;height:13px}
.hr .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hr .tx .sm{margin-left:4px}
.hr.bad .tx{color:var(--err)}.hr.me .tx{color:var(--accent)}.hr.quiet .tx{color:var(--tx3)}
.hx{grid-column:1/-1;margin:2px 0 6px 26px;padding:8px 10px;border-left:2px solid var(--line2);display:flex;flex-direction:column;gap:5px;font-size:12px;cursor:default}
.hx .kv{display:flex;gap:12px;flex-wrap:wrap;color:var(--tx2)}.hx .kv span{display:inline-flex;gap:4px;align-items:center}.hx .kv svg{width:12px;height:12px}
.hx .it{display:flex;gap:8px;align-items:center;min-height:22px}
.hx .it .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.hx .it .w{font-size:11px;padding:0 6px;border-radius:4px;background:var(--bg3);color:var(--tx2);white-space:nowrap}
.hx .it .w.pend{background:var(--warn2);color:var(--warn)}
.hx .it .y{color:var(--tx3);font-size:11.5px;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx details summary{cursor:pointer;color:var(--tx3);font-size:11.5px;list-style:none}.hx details summary::-webkit-details-marker{display:none}
.hx pre{margin:4px 0 0;white-space:pre-wrap;font:11px/1.45 Consolas,monospace;color:var(--tx2)}
.more{border:0;background:none;color:var(--tx3);cursor:pointer;padding:4px;display:inline-flex;gap:4px;align-items:center;font-size:11.5px}.more:hover{color:var(--tx)}
.fl{display:flex;gap:4px;align-items:center}
.fl button{border:1px solid var(--line2);background:none;border-radius:5px;padding:2px 7px;cursor:pointer;display:inline-flex;color:var(--tx2)}.fl button.on{background:var(--ac2);border-color:transparent;color:var(--accent)}
.day{font-size:12px;font-weight:600;color:var(--tx2);margin:14px 0 4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const P={moa:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 4h7M14 9h7M14 15h7M14 20h7"/>',lms:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',note:'<path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',plus:'<path d="M12 5v14M5 12h14"/>',run:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',rss:'<path d="M5 11a8 8 0 0 1 8 8"/><path d="M5 4a15 15 0 0 1 15 15"/><circle cx="6" cy="18" r="1.2"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',repeat:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
spark:'<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/>',pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
check:'<path d="M20 6 9 17l-5-5"/>',next:'<path d="M5 12h12M13 7l5 5-5 5"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
web:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 8.5h8.4M8.97 13.75 4.7 6.4M15 13.75l-4.2 7.2"/>',gauge:'<path d="M12 14l4-4"/><path d="M3.3 19a9 9 0 1 1 17.4 0"/>',power:'<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GROUP=[['강의','lms'],['공지','note'],['구독','rss'],['일정','cal']];
const LABEL={vault:'볼트',pend:'판정 대기',wait:'대기 칸',ledger:'장부',arch:'보관 칸'};
const send=m=>parent.postMessage(m,'*');
let D=null,sel=null,seg='vault';
// 위쪽 꼴 = 왼쪽 곁창이 이 화면 옆에 열림(brain-base 0.38.3 부터 {t:'env', left:{open, beside}} 로 알림 · 자료보다 먼저) 또는 좁은 폭(≤760px · 곁창과 상관없이)
let BESIDE=false,lastTop=null;
// 튜토리얼 가리킬 이름 data-tt(화면 문 E3 · brain-base 0.43 부터 찾기·누르기·사건 알림을 바탕이 맡음) — 두 꼴(나무 .lr · 위쪽 .ch)에 같은 이름 · 이름 목록은 tutorial_lint.py 가 이 파일에서 읽는다
// «출처»는 고르지 않은 출처에만 단다 — 화면 문은 이름이 같은 첫 보이는 것을 고르므로, 가리키기가 이미 고른 줄이 아니라 고를 줄을 가리키게(8-수집 «출처»)
const TOP=()=>BESIDE||innerWidth<=760;
window.addEventListener('message',e=>{

function fold(list){
  const out=[];
  for(const r of list){const p=out[out.length-1];if(p&&quiet(r)&&p.quiet&&p.t.slice(0,5)===r.t.slice(0,5)){p.n++;p.last=r.t;continue}out.push(quiet(r)?{...r,quiet:true,n:1,last:r.t}:r)}
  return out;
}
function hrow(s,r,i){

  const tx=r.quiet&&r.n>1?`<span class="sm">변화 없음 ×${r.n}</span>`:headTx(r);
  return`<div class="hr ${cls} ${hopen===key?'open':''}" data-h="${key}"><span class="tm">${esc(r.t)}</span><span class="wh tt" aria-label="${w[1]}">${ic(w[0])}</span><span class="tx">${tx}</span>${hopen===key?hx(s,r):''}</div>`;
}

}

function rejectBox(s,x){

  el.innerHTML=`<div class="rj"><p class="q">거절하시겠습니까?</p><p class="t">${esc(x.title)}</p><div class="chips">${(x.words||[]).map(w=>`<button class="wd" data-w="${esc(w)}" aria-pressed="false">${esc(w)}</button>`).join('')}</div><input class="memo" aria-label="메모" placeholder="메모" maxlength="200"><div class="row"><button class="btn" data-n>취소</button><button class="btn warn" data-y>거절</button></div></div>`;

    r.push(recvRow(s));
    r.push(`<label>알림</label>${alarmCell(s.alarm)}`);
    r.push(`<label>과목</label><div>${s.courses.map(c=>`<div class="crow ${c.on?'':'off'}"><span class="n">${esc(c.name)}</span><span class="sm">${c.on?`글 ${c.posts} · 파일 ${c.files} · 게시판 ${c.board}`:'뺌'}</span><button class="sw ${c.on?'on':''}" data-src="${esc(s.id)}" data-f="course" data-v="${esc(c.id)}=${c.on?'off':'on'}" aria-label="${c.on?'빼기':'넣기'}"><i></i></button></div>`).join('')}</div>`);
    return`<div class="ed">${r.join('')}</div>`;
  }
  if(s.fixed){r.push(`<label>주기</label><span class="sm">주간 점검 · 30일</span>`);r.push(`<label>알림</label>${alarmCell(s.alarm)}`);return`<div class="ed">${r.join('')}</div>`}
  if(s.keep)r.push(`<label>남길 말</label>${chips(s.keep,s.id,'keep')}`);
  r.push(`<label>뺄 말</label><div>${chips(s.skip,s.id,'skip')}</div>`);
  if(s.target)r.push(`<label>대상</label><span class="chip" style="justify-self:start">${esc(s.target)}</span>`);
  r.push(recvRow(s));
  if(s.cnt&&D.autoJudge)r.push(`<label>자동 판정</label><div class="line">${sw(s.auto,'자동 판정',s.id,'auto')}<span class="sm">대기 칸 ${esc(s.keepDays)}일</span></div>`);
  r.push(`<label>알림</label>${alarmCell(s.alarm)}`);
  return`<div class="ed">${r.join('')}</div>`;
}
const evs=s=>s.events.length?`<div class="ev">${s.events.map(e=>`<span>${esc(e.t)}</span><span class="${e.bad?'bad':e.me?'me':''}">${esc(e.s)}</span>`).join('')}</div>`:'<span class="sm">—</span>';
function itemOps(x,s){
  const live=s.on&&!D.allOff;
  if(x.where==='vault')return[x.mark==='헛것'?['useful','쓸모']:['useless','헛것']];
  if(x.where==='arch')return[['restore','되돌리기']];
  const ok=live?[['rescue','승인']]:[];   // 승인은 글·첨부를 받을 수 있어 끈 출처엔 없다
  return x.where==='pend'?[...ok,['reject','거절']]:ok;   // 승인이 먼저(11-09)
}
function itemRow(x,s){
  const btn=(x.id?itemOps(x,s):[]).map(op=>`<button class="btn act" data-item="${esc(s.id)}" data-aid="${esc(x.id)}" data-op="${op[0]}">${op[1]}</button>`).join('');
  const inner=`<span class="n" title="${esc(x.title)}">${esc(x.title)}</span>${x.why?`<span class="y" title="${esc(x.why)}">${esc(x.why)}</span>`:''}${x.mark?`<span class="sm">${esc(x.mark)}</span>`:''}<span class="sm">${esc((x.date||'').slice(5))}</span>${btn}`;
  return x.note?`<div class="it go" role="button" tabindex="0" data-note="${esc(x.note)}" data-tt="글">${inner}</div>`:`<div class="it" data-tt="글">${inner}</div>`;
}
const itemList=(s,w,n)=>(s.items||[]).filter(x=>x.where===w).slice(0,n).map(x=>itemRow(x,s)).join('')||'<span class="sm">—</span>';
function listRow(s){
  const st=status(s);
  return`<button class="lr ${sel===s.id?'sel':''} ${s.on&&!D.allOff?'':'off'}" data-sel="${esc(s.id)}" ${sel===s.id?'':'data-tt="출처"'}><span class="dot ${st.c}"></span><span class="n">${esc(s.name)}</span>${differ(s)?`<span class="mk tt" aria-label="추천과 다름">${ic('spark')}</span>`:''}${st.w&&st.c!=='off'?`<span class="flair ${st.c}">${esc(st.w)}</span>`:`<span class="flair">${st.c==='off'?'꺼짐':flair(s)}</span>`}</button>`;
}
function chip(s){
  const st=status(s);
  return`<button class="ch ${sel===s.id?'sel':''} ${s.on&&!D.allOff?'':'off'}" data-sel="${esc(s.id)}" ${sel===s.id?'':'data-tt="출처"'}><span class="dot ${st.c}"></span><span class="n">${esc(s.name)}</span>${differ(s)?`<span class="mk tt" aria-label="추천과 다름">${ic('spark')}</span>`:''}${st.c==='err'||st.c==='warn'?`<span class="flair ${st.c}">${esc(st.w)}</span>`:''}</button>`;
}
function candChip(c){return`<button class="ch ${sel==='cand:'+c.id?'sel':''} off" data-sel="cand:${esc(c.id)}" data-tt="후보"><span class="dot off"></span><span class="n">${esc(c.name)}</span>${c.answer==='계약'?'<span class="flair warn">계약 대기</span>':''}</button>`}
function topBand(sws){
  const row=(i,g,html)=>`<div class="tp-r"><span class="tp-g">${ic(i)}${g}</span><div class="tp-c">${html}</div></div>`;
  return`<div class="tp">${sws}${GROUP.map(([g,i])=>{const l=D.sources.filter(x=>x.group===g);return l.length?row(i,g,l.map(chip).join('')):''}).join('')}${(D.candidates||[]).length?row('plus','후보',D.candidates.map(candChip).join('')):''}<div class="tp-r"><span></span><div class="tp-c"><button class="ch add" data-add data-tt="수집 추가">${ic('plus')}<span class="n">수집 추가</span></button></div></div></div>`;
}
function statsOf(s){
  const c=s.cnt;
  if(c)return`<div class="stats" data-tt="숫자 칸">${['vault','pend','wait','ledger','arch'].map(k=>`<button class="${seg===k?'sel':''} ${k==='pend'&&c[k]?'warn':''}" data-seg="${k}"><b>${c[k]}</b><span>${LABEL[k]}</span></button>`).join('')}</div>`;
  if(s.tot){const on=s.courses.filter(x=>x.on).length;return`<div class="stats" data-tt="숫자 칸"><div><b>${s.tot.posts}</b><span>글</span></div><div><b>${s.tot.files}</b><span>파일</span></div><div><b>${s.tot.board}</b><span>게시판 글</span></div><div><b>${on}</b><span>과목</span></div><div><b>${s.courses.length-on}</b><span>뺀 과목</span></div></div>`}
  if(s.flow)return`<div class="stats" data-tt="숫자 칸"><div><b>${s.flow.in}</b><span>본 줄</span></div><div><b>${s.flow.keep}</b><span>일정</span></div><div><b>${Math.max(0,s.flow.in-s.flow.keep)}</b><span>뺌</span></div></div>`;
  return'<div style="height:16px"></div>';
}
function pendOf(s){return s.cnt?s.cnt.pend:s.pend||0}
function headActs(s){
  if(s.fixed||!s.on||D.allOff)return'';
  if(s.busy)return`<span class="flair">${esc(s.busy)}</span>`;
  const n=pendOf(s),old=s.ext&&s.ext.have&&s.ext.want&&s.ext.have!==s.ext.want;   // 옛 판 확장은 지금 받기를 못 읽는다
  return`${n?`<button class="btn warn" data-judge="${esc(s.id)}" data-tt="판정">판정 ${n}</button>`:''}${old?'':s.fetchWait?'<span class="flair">받기 대기</span>':`<button class="ib" data-fetch="${esc(s.id)}" data-tt="지금 받기" aria-label="지금 받기">${ic('run')}</button>`}`;
}
function candDetail(c){
  return`<div class="b-h"><h2>${esc(c.name)}</h2><button class="link sm" data-open="${esc(c.id)}">${esc(c.host)}</button><span style="flex:1"></span>${c.answer==='계약'?'<span class="flair warn">계약 대기</span>':`<button class="btn" data-cand="${esc(c.id)}" data-a="안 함">안 함</button><button class="btn warn" data-cand="${esc(c.id)}" data-a="계약" data-tt="계약">계약</button>`}</div>
  <div class="ed" style="margin-top:16px"><label>잰 것</label><span>${esc(c.measured)}</span>${c.note?`<label>근거</label><button class="link" style="justify-self:start" data-note="${esc(c.note)}">${esc(c.note.split('/').pop().slice(0,-3))}</button>`:''}</div>`;
}
function detail(s){
  const low=s.cnt?`<div style="margin-top:18px"><p class="sec">${LABEL[seg]}</p>${itemList(s,seg,200)}</div>`:s.family==='listing'?`<div style="margin-top:18px"><p class="sec">일정</p>${itemList(s,'vault',8)}</div>`:'';
  const probs=(s.problems||[]).map((p,i)=>`<div class="prob"><span class="sm">${esc(p.t)}</span><span class="s">${esc(p.s)}</span>${s.fix&&i===0?`<button class="btn err" data-fix="${esc(s.id)}" data-tt="고침">고침</button>`:''}</div>`).join('');
  return`<div class="b-h"><h2>${esc(s.name)}</h2>${s.url?`<button class="link sm" data-open="${esc(s.id)}" data-tt="주소">${esc(s.host)}</button>`:`<span class="sm">${esc(s.host)}</span>`}${(s.moa||[]).map(m=>`<button class="moc" data-moa="${esc(m.path)}">${ic('moa')}${esc(m.name)}</button>`).join('')}<span style="flex:1"></span>${headActs(s)}<span data-tt="스위치" style="display:inline-flex">${sw(s.on,s.on?'끄기':'켜기',s.id,'enabled',s.fixed)}</span></div>
  <div class="meta"><span class="tt" aria-label="다음">${ic('next')}${esc(lmsOf(s)?(s.wakeOn&&s.on&&(s.at||[]).length?s.nextAt:'15분'):s.next)}</span><span class="tt" aria-label="마지막">${ic('check')}${esc(s.last||'—')}</span></div>
  ${probs}${statsOf(s)}<div class="b-g"><div>${editor(s)}${low}</div><div data-tt="일어난 일">${hist(s)}</div></div>`;
}
function draw(){
  const app=document.getElementById('app');
  if(!D)return;
  if(!D.sources.length){app.innerHTML='<div class="none">출처 없음</div>';return}
  if(!sel||!(S(sel)||C(sel)))sel=firstMine().id;
  const sws=`<div class="b-top"><button class="ib tt ${pop?'on':''}" data-pop aria-label="설정" data-tt="설정">${ic('gear')}</button></div>${pop?popHtml():''}`;
  const right=`<div class="b-r">${C(sel)?candDetail(C(sel)):full&&S(sel)?fullView(S(sel)):detail(S(sel))}</div>`;
  lastTop=TOP();
  if(lastTop){app.innerHTML=topBand(sws)+right;return}
  const left=GROUP.map(([g,i])=>{const l=D.sources.filter(x=>x.group===g);return l.length?`<div class="grp-h">${ic(i)}${g}<span class="sm">${l.length}</span></div><div class="grp-b">${l.map(listRow).join('')}</div>`:''}).join('')+((D.candidates||[]).length?`<div class="grp-h">${ic('plus')}후보<span class="sm">${D.candidates.length}</span></div><div class="grp-b">${D.candidates.map(candRow).join('')}</div>`:'')
    +`<button class="lr add" data-add data-tt="수집 추가">${ic('plus')}<span class="n">수집 추가</span></button>`;   // 목록 맨 아래 붙박이(목록이 길어져도 보임)
  const y=app.querySelector('.b-r')?.scrollTop||0;
  app.innerHTML=`<div class="b"><div class="b-l">${sws}${left}</div>${right}</div>`;
  const r=app.querySelector('.b-r');if(r)r.scrollTop=y;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-sel],[data-seg],[data-note],[data-f],[data-item],[data-open],[data-fetch],[data-judge],[data-cand],[data-add],[data-fix],[data-options],[data-mode],[data-atdel],[data-pop],[data-edit],[data-follow],[data-moa]');
  if(pop&&!e.target.closest('.pop,[data-pop],.dlg')){pop=false;if(!t)return draw()}
  if(!t||t.disabled)return;
  const d=t.dataset;
  // 대화 입구(3_시스템/views.json chat) — 명령·첫 질문은 선언에서 온다 · 화면은 입구 이름·출처 id·보여 줄 실패 줄만 보낸다(보내기는 사용자 답)
  if('add' in d)return send({t:'chat',entry:'add'});
  if('options' in d)return send({t:'options'});
  if(d.moa)return send({t:'open',target:{note:d.moa}});
  if(d.fix){const s=S(d.fix);return send({t:'chat',entry:'fix',args:{source:d.fix},detail:`${s.name} · ${(s.problems||[]).map(p=>p.t+' '+p.s).join(' / ')}`})}
  if(d.mode){   // 주기 ↔ 시각 — 시각은 첫 시각을 넣을 때 정해진다 · 주기로 돌리면 시각을 걷는다(지금 주기 값 그대로)
    const s=S(d.mode),cur=atOpen.has(s.id)?'at':s.mode;
    if(d.v===cur)return;
    if(d.v==='at'){atOpen.add(s.id);draw();document.querySelector(`[data-atadd="${CSS.escape(s.id)}"]`)?.focus();return}
    atOpen.delete(s.id);return s.mode==='at'?act(s.id,'hours',s.hours):draw();
  }
  if('pop' in d){pop=!pop;return draw()}
  if('edit' in d){edit=d.edit||null;atOpen.clear();draw();if(edit)document.querySelector(`[data-atadd="${CSS.escape(edit)}"]`)?.focus();return}
  if(d.follow){const s=S(d.follow);edit=null;return act(s.id,'at',s.rec.join(','))}   // 추천 따르기 = 그 시각으로(웹은 주기 → 시각)
  if(d.atdel){const s=S(d.atdel);return act(s.id,'at',(s.at||[]).filter(x=>x!==d.v).join(','))}
  if(d.item&&d.op==='reject'){const s=S(d.item),x=s&&(s.items||[]).find(y=>y.id===d.aid);if(x)return rejectBox(s,x)}
  if(d.item)return send({t:'act',id:'collect_desk.item',args:{source:d.item,id:d.aid,op:d.op}});
  if(d.open)return send({t:'act',id:'collect_desk.open',args:{source:d.open}});
  if(d.fetch)return send({t:'act',id:'collect_desk.fetch',args:{source:d.fetch}});
  if(d.judge)return ask('구독 사용량을 씁니다. 판정하시겠습니까?','판정',()=>send({t:'act',id:'collect_desk.judge',args:{source:d.judge}}));
  if(d.cand){const go=()=>send({t:'act',id:'collect_desk.contract',args:{id:d.cand,answer:d.a}});return d.a==='계약'?ask(`${C('cand:'+d.cand).name} 수집을 계약하시겠습니까?`,'계약',go):go()}
  if(d.f){
    const go=()=>act(d.src,d.f,d.v);
    if(d.f==='all_off'&&d.v==='true')return ask('모든 수집을 끄시겠습니까?','끄기',go);
    if((d.f==='auto'||d.f==='auto_judge')&&d.v==='true')return ask('구독 사용량을 씁니다. 자동 판정을 켜시겠습니까?','켜기',go);
    return go();
  }
  if(d.sel){sel=d.sel;edit=null;const s=S(sel);if(s&&s.cnt&&!s.cnt[seg])seg=s.cnt.pend?'pend':'vault';return draw()}
  if(d.seg){seg=d.seg;return draw()}
  if(d.note)send({t:'open',target:{note:d.note}});
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.hours)act(d.hours,'hours',t.value);
  else if(d.atadd&&t.value.trim())addAt(t);     // Enter 없이 칸을 떠나도(창을 닫아도) 넣은 시각이 남게
  else if(d.purpose&&t.value.trim()!==S(d.purpose).purpose)act(d.purpose,'purpose',t.value);
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key!=='Enter')return;
  if(t.dataset.note&&t.classList.contains('it'))return send({t:'open',target:{note:t.dataset.note}});
  if(t.dataset.purpose)return t.blur();
  if(t.dataset.chip&&t.value.trim()){const[src,f]=t.dataset.chip.split('|');act(src,f,t.value.trim());t.value=''}
  if(t.dataset.atadd)addAt(t);
});
send({t:'ready'});
</script>
</body>
